site_name: geocatalog
site_description: Spatiotemporal catalog over geospatial files — the GeoSlice-driven index extracted from geotoolz.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/geocatalog
repo_name: jejjohnson/geocatalog

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true

nav:
  - Home: index.md
  - Concepts:
      - Catalogs: catalogs.md
      - CLI: cli.md
  - Tutorials:
      - Catalog intro: notebooks/catalog_intro.ipynb
      - Catalog set algebra: notebooks/catalog_set_algebra.ipynb
      - Catalog backends: notebooks/catalog_backends.ipynb
      - Catalog (DuckDB): notebooks/catalog_duckdb.ipynb
      - Catalog ↔ patching: notebooks/catalog_patching.ipynb
  - API Reference: api/reference.md
  - Contributing: contributing.md
  - Changelog: CHANGELOG.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
